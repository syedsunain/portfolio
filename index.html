<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title>
<style>
:root{--bg:#05060f;--c:#00e5ff;--p:#a855f7;--t:#e8ecff;--m:#8b93b8}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t);font:16px/1.6 system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1}
nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 5vw;backdrop-filter:blur(12px);background:#05060fb0;z-index:5;border-bottom:1px solid #00e5ff22}
nav b{letter-spacing:3px;color:var(--c)}
nav div{display:flex;align-items:center;gap:16px;overflow-x:auto}
nav a{color:var(--m);text-decoration:none;font-size:14px;white-space:nowrap}
nav a:hover{color:var(--c)}
nav a.r{color:var(--c);border:1px solid var(--c);padding:5px 14px;border-radius:20px}
section{padding:90px 6vw 20px;max-width:1100px;margin:auto}
#home{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:50px;flex-wrap:wrap}
.ph{width:240px;height:240px;border-radius:50%;object-fit:cover;border:2px solid var(--c);box-shadow:0 0 40px #00e5ff66,0 0 90px #a855f755;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
small{color:var(--c);letter-spacing:4px}
h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.1;background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
h2{font-size:1.7rem;margin-bottom:22px;color:var(--c);letter-spacing:2px}
.role{color:var(--m);font-size:1.2rem}
.btn{display:inline-block;margin:22px 12px 0 0;padding:12px 26px;border-radius:30px;text-decoration:none;font-weight:600;color:#05060f;background:linear-gradient(90deg,var(--c),var(--p));box-shadow:0 0 25px #00e5ff55;transition:.3s}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 40px #a855f799}
.btn.g{background:none;color:var(--c);border:1px solid var(--c);box-shadow:none}
.card{background:#0d1230aa;border:1px solid #00e5ff33;border-radius:18px;padding:22px;backdrop-filter:blur(10px);transition:transform .15s,box-shadow .3s;will-change:transform}
.card:hover{box-shadow:0 0 35px #00e5ff33}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.col{display:grid;gap:18px}
.card h3{margin-bottom:4px}
.card p,.org{color:var(--m)}
.org{color:var(--p);font-size:14px;margin-bottom:6px}
.card a{color:var(--c);text-decoration:none;display:inline-block;margin:10px 18px 0 0}
.bar{margin-bottom:14px}
.bar div:first-child{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.tr{height:8px;border-radius:8px;background:#ffffff14;overflow:hidden}
.tr i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--c),var(--p));box-shadow:0 0 12px var(--c)}
footer{text-align:center;color:var(--m);padding:40px 20px;font-size:13px}
@media(max-width:700px){#home{text-align:center}}
</style></head>
<body>
<canvas id="bg"></canvas>
<nav><b id="logo">PORTFOLIO</b><div id="links"></div></nav>

<section id="home">
  <img class="ph tilt" id="photo" alt="Profile photo">
  <div>
    <small>HELLO, I AM</small>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <p id="tagline" style="margin-top:10px;color:var(--m);max-width:460px"></p>
    <a class="btn" id="resume" target="_blank" rel="noopener">View Resume</a>
    <a class="btn g" href="#contact">Contact Me</a>
  </div>
</section>
<section id="about"><h2>// ABOUT</h2><div class="card tilt"><p id="aboutText" style="white-space:pre-line;color:var(--t)"></p></div></section>
<div id="main"></div>
<section id="contact" style="min-height:60vh"><h2>// CONTACT</h2>
  <div class="card tilt"><p>Let's connect and build something together.</p><p id="loc"></p><a id="mail"></a><div id="soc"></div></div>
</section>
<footer id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const safe=u=>/^(https?:|mailto:)/i.test(u||'')?u:'#';
const link=(u,t)=>{const a=el('a',0,t);a.href=safe(u);a.target='_blank';a.rel='noopener';return a};

function item(type,it){
  if(type=='bars'){
    const b=el('div','bar'),l=Math.max(0,Math.min(100,parseInt(it.level)||0));
    const top=el('div');top.append(el('span',0,it.title),el('span',0,l+'%'));
    const tr=el('div','tr'),f=el('i');f.style.width=l+'%';tr.append(f);b.append(top,tr);return b}
  const c=el('div','card tilt');c.append(el('h3',0,it.title));
  if(type=='timeline'){const o=[it.org,it.period].filter(Boolean).join('  •  ');if(o)c.append(el('div','org',o))}
  if(it.desc)c.append(el('p',0,it.desc));
  if(it.link)c.append(link(it.link,type=='cards'?'View →':'Link →'));
  return c}

function render(d){
  document.title=d.name+' | Portfolio';
  $('logo').textContent=(d.name.split(' ')[0]||'PORTFOLIO').toUpperCase();
  $('photo').src=d.photo||DEFAULT.photo;
  $('name').textContent=d.name;$('role').textContent=d.role;$('tagline').textContent=d.tagline;
  $('aboutText').textContent=d.about;
  d.resume?($('resume').href=safe(d.resume),$('resume').style.display=''):($('resume').style.display='none');
  const m=$('main'),nav=[['about','About']];m.replaceChildren();
  SECTIONS.forEach(s=>{
    const items=d[s.key]||[];if(!items.length)return;
    const sec=el('section'),box=el('div',s.type=='cards'?'grid':'col');sec.id=s.key;
    sec.append(el('h2',0,'// '+s.title.toUpperCase()));
    if(s.type=='bars')box.className='card';
    items.forEach(i=>box.append(item(s.type,i)));sec.append(box);m.append(sec);
    nav.push([s.key,s.title.split(' ')[0]])});
  nav.push(['contact','Contact']);
  const L=$('links');L.replaceChildren(...nav.map(([k,t])=>{const a=el('a',0,t);a.href='#'+k;return a}));
  if(d.resume){const r=link(d.resume,'Resume');r.className='r';L.append(r)}
  $('mail').href='mailto:'+d.email;$('mail').textContent=d.email;$('loc').textContent=d.location?'📍 '+d.location:'';
  $('soc').replaceChildren(...(d.socials||'').split('\n').filter(l=>l.includes('|')).map(l=>{
    const [n,u]=l.split('|').map(x=>x.trim());return link(u,n)}));
  $('foot').textContent='© '+new Date().getFullYear()+' '+d.name;
}
render(DEFAULT);
if(CFG.supabaseUrl){
  supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey).from('site_content').select('data').eq('id','main').maybeSingle()
    .then(({data})=>{if(data)render(norm({...DEFAULT,...data.data}))});
}

/* 3D background */
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);C.position.z=6;
const W=new THREE.WebGLRenderer({canvas:$('bg'),alpha:true,antialias:true});W.setPixelRatio(Math.min(devicePixelRatio,2));
function rs(){W.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}rs();addEventListener('resize',rs);
const a=new Float32Array(5400);for(let i=0;i<a.length;i++)a[i]=(Math.random()-.5)*30;
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));
const P=new THREE.Points(g,new THREE.PointsMaterial({color:0x00e5ff,size:.035}));S.add(P);
const wf=(geo,col,op)=>new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col,wireframe:true,transparent:true,opacity:op}));
const K=wf(new THREE.TorusKnotGeometry(1.4,.4,160,20),0xa855f7,.35);K.position.set(3.5,0,-2);S.add(K);
const I=wf(new THREE.IcosahedronGeometry(1.1,1),0x00e5ff,.4);I.position.set(-4,-1,-3);S.add(I);
let mx=0,my=0;addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
(function L(){requestAnimationFrame(L);
  const t=performance.now()/1000,s=Math.min(scrollY/innerHeight,6);
  P.rotation.y=t*.03+s*.3;K.rotation.set(t*.2+s,t*.3,0);I.rotation.set(s,-t*.25,0);
  C.position.x+=(mx*2-C.position.x)*.05;C.position.y+=(-my*1.5-s*.8-C.position.y)*.05;
  C.lookAt(0,-s*.8,0);W.render(S,C);
})();

/* 3D tilt on cards and photo */
addEventListener('mousemove',e=>document.querySelectorAll('.tilt').forEach(c=>{
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  c.style.transform=(Math.abs(x)<.6&&Math.abs(y)<.6)?`perspective(700px) rotateY(${x*12}deg) rotateX(${-y*12}deg)`:'';
}));
</script>
</body></html>
